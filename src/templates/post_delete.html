{% extends "base.html" %}

{% block content %}
<div>
    <h1>Delete Article</h1>
    <div>
        <div>
            <p>Are you sure you want to delete "{{ post.title }}"?</p>
            <form action="" method="post"> {% csrf_token %}
                <div>
                    <a href="{% url 'book_detail' book_id=book.id pk=post.id %}">Cancel</a>
                    <button type="submit">Confirm</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
